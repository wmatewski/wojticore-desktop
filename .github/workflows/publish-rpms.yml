name: Publish RPM repository
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.GCP_WIF_PROVIDER != '' && vars.GCP_PUBLISHER_SERVICE_ACCOUNT != '' && vars.GCS_BUCKET != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify backend
        working-directory: backend
        run: npm ci && npm test && npm run build
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Verify frontend
        working-directory: frontend
        run: npm ci && npm run check && npm run build
      - name: Select release channel and version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo CHANNEL=stable >> "$GITHUB_ENV"
            echo "RELEASE_VERSION=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')" >> "$GITHUB_ENV"
          else
            echo CHANNEL=development >> "$GITHUB_ENV"
            echo "RELEASE_VERSION=0.1.0-alpha.$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
          fi
      - name: Build RPMs
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm rpm-sign createrepo-c gnupg python3
          RPM_VERSION="$RELEASE_VERSION" ./scripts/build-rpms.sh
      - name: Load scoped signing key from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_DESKTOP_TOKEN }}
          DOPPLER_PROJECT: wojticore-desktop
          DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG || 'prd' }}
        run: |
          set -euo pipefail
          curl -sLf --retry 3 https://cli.doppler.com/install.sh | sudo sh
          key_file="$RUNNER_TEMP/rpm-signing-key.asc"
          umask 077
          doppler secrets get RPM_GPG_PRIVATE_KEY --plain -p "$DOPPLER_PROJECT" -c "$DOPPLER_CONFIG" > "$key_file"
          gpg --batch --import "$key_file"
          rm -f "$key_file"
          RPM_SIGNING_KEY_ID="$(doppler secrets get RPM_GPG_KEY_ID --plain -p "$DOPPLER_PROJECT" -c "$DOPPLER_CONFIG")"
          echo "RPM_SIGNING_KEY_ID=$RPM_SIGNING_KEY_ID" >> "$GITHUB_ENV"
          export RPM_SIGNING_KEY_ID
          ./scripts/sign-rpms.sh
      - name: Publish channel
        env:
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
        run: |
          ./scripts/publish-rpms.sh
