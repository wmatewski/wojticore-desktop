name: Stable release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  changes:
    name: Release / Select changed RPMs
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.rpms.outputs.packages }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tags and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version tag and main ancestry
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Stable tags must use vX.Y.Z.' >&2; exit 2; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo 'Stable tags must point to a commit on main.' >&2; exit 2; }
          printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Find previous stable tag
        id: base
        run: |
          previous="$(git tag --merged "$GITHUB_SHA^" --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          printf 'sha=%s\n' "${previous:-ALL}" >> "$GITHUB_OUTPUT"
      - name: Select changed RPM dependency closure
        id: rpms
        env:
          RELEASE_BASE: ${{ steps.base.outputs.sha }}
          RELEASE_SHA: ${{ github.sha }}
        run: ./scripts/changed-rpms.sh "$RELEASE_BASE" "$RELEASE_SHA"

  build:
    name: Stable release / Build selected RPMs
    needs: changes
    if: needs.changes.outputs.packages != ''
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install RPM tools
        run: dnf install -y rpm-build
      - name: Build selected RPM packages
        env:
          RPM_PACKAGES: ${{ needs.changes.outputs.packages }}
          RPM_VERSION: ${{ needs.changes.outputs.version }}
        run: ./scripts/build-rpms.sh
      - name: Upload RPM artifacts for Stable publication
        uses: actions/upload-artifact@v6
        with:
          name: stable-rpms
          path: dist/rpms/*.rpm
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Stable release / Sign and publish RPMs
    needs: [changes, build]
    if: needs.changes.outputs.packages != ''
    runs-on: ubuntu-latest
    environment: prd
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify RPM publication is enabled
        env:
          PUBLISH_RPMS: ${{ vars.PUBLISH_RPMS }}
        run: test "$PUBLISH_RPMS" = true
      - name: Check out publication scripts
        uses: actions/checkout@v7
      - name: Set up Google Cloud Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Install RPM repository tools
        run: sudo apt-get update && sudo apt-get install -y createrepo-c rpm
      - name: Download selected RPM packages
        uses: actions/download-artifact@v7
        with:
          name: stable-rpms
          path: dist/rpms
      - name: Install Doppler CLI
        run: curl -sLf --retry 3 https://cli.doppler.com/install.sh | sudo sh
      - name: Import RPM signing key
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_DESKTOP_TOKEN }}
          DOPPLER_PROJECT: wojticore-desktop
          DOPPLER_CONFIG: prd
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/rpm-signing-key.asc"
          umask 077
          doppler secrets get RPM_GPG_PRIVATE_KEY --plain -p "$DOPPLER_PROJECT" -c "$DOPPLER_CONFIG" > "$key_file"
          gpg --batch --import "$key_file"
          rm -f "$key_file"
          RPM_SIGNING_KEY_ID="$(doppler secrets get RPM_GPG_KEY_ID --plain -p "$DOPPLER_PROJECT" -c "$DOPPLER_CONFIG")"
          echo "RPM_SIGNING_KEY_ID=$RPM_SIGNING_KEY_ID" >> "$GITHUB_ENV"
      - name: Sign selected RPM packages
        run: ./scripts/sign-rpms.sh
      - name: Publish Stable repository metadata and manifest
        env:
          CHANNEL: stable
          RELEASE_VERSION: ${{ needs.changes.outputs.version }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
        run: ./scripts/publish-rpms.sh
