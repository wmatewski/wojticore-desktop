name: Main CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_development:
        description: Publish all selected packages to the Development repository
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  pull-requests: read
jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      rpms: ${{ steps.rpms.outputs.packages }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select changed areas
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch || -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            printf 'backend=true\nfrontend=true\n' >> "$GITHUB_OUTPUT"
            echo ALL > "$RUNNER_TEMP/change-base"
            exit 0
          fi
          printf '%s\n' "$BEFORE_SHA" > "$RUNNER_TEMP/change-base"
          git diff --name-only "$BEFORE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          backend=false
          frontend=false
          while IFS= read -r file; do
            [[ "$file" == backend/* || "$file" == cloudbuild/* ]] && backend=true
            [[ "$file" == frontend/* ]] && frontend=true
          done < "$RUNNER_TEMP/changed-files"
          printf 'backend=%s\nfrontend=%s\n' "$backend" "$frontend" >> "$GITHUB_OUTPUT"
      - name: Select RPM dependency closure
        id: rpms
        env:
          HEAD_SHA: ${{ github.sha }}
        run: ./scripts/changed-rpms.sh "$(cat "$RUNNER_TEMP/change-base")" "$HEAD_SHA"

  backend:
    name: Backend / Test and build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run API tests
        run: npm test
      - name: Compile TypeScript
        run: npm run build

  workflow-check:
    name: Workflow / Validate configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Validate shell scripts
        run: bash -n installer/install.sh scripts/*.sh
      - name: Test RPM dependency selection
        run: ./scripts/test-changed-rpms.sh
      - name: Parse GitHub Actions and Cloud Build YAML
        run: |
          for file in .github/workflows/*.yml .github/dependabot.yml cloudbuild/*.yaml; do
            ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' "$file"
          done

  frontend:
    name: Frontend / Check and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Upload site assets for deployment
        if: github.event_name == 'push' && vars.DEPLOY_FRONTEND == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: frontend-site
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  rpms:
    name: RPM / Build changed packages
    needs: changes
    if: needs.changes.outputs.rpms != ''
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install RPM tools
        run: dnf install -y rpm-build
      - name: Build selected RPM packages
        env:
          RPM_PACKAGES: ${{ needs.changes.outputs.rpms }}
          RPM_VERSION: 0.1.0-alpha.${{ github.run_number }}
        run: ./scripts/build-rpms.sh
      - name: Upload RPM artifacts for Development publication
        if: github.event_name == 'push' || inputs.publish_development
        uses: actions/upload-artifact@v6
        with:
          name: development-rpms
          path: dist/rpms/*.rpm
          if-no-files-found: error
          retention-days: 7

  publish-development:
    name: Development / Sign and publish RPMs
    needs: [changes, rpms]
    if: (github.event_name == 'push' || inputs.publish_development) && needs.changes.outputs.rpms != '' && vars.PUBLISH_RPMS == 'true'
    runs-on: ubuntu-latest
    environment: prd
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out publication scripts
        uses: actions/checkout@v7
      - name: Set up Google Cloud Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Download selected RPM packages
        uses: actions/download-artifact@v7
        with:
          name: development-rpms
          path: dist/rpms
      - name: Install Doppler CLI
        run: curl -sLf --retry 3 https://cli.doppler.com/install.sh | sudo sh
      - name: Import RPM signing key
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_DESKTOP_TOKEN }}
          DOPPLER_PROJECT: wojticore-desktop
          DOPPLER_CONFIG: prd
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/rpm-signing-key.asc"
          umask 077
          doppler secrets get RPM_GPG_PRIVATE_KEY --plain -p "$DOPPLER_PROJECT" -c "$DOPPLER_CONFIG" > "$key_file"
          gpg --batch --import "$key_file"
          rm -f "$key_file"
          RPM_SIGNING_KEY_ID="$(doppler secrets get RPM_GPG_KEY_ID --plain -p "$DOPPLER_PROJECT" -c "$DOPPLER_CONFIG")"
          echo "RPM_SIGNING_KEY_ID=$RPM_SIGNING_KEY_ID" >> "$GITHUB_ENV"
      - name: Sign selected RPM packages
        run: ./scripts/sign-rpms.sh
      - name: Publish Development repository metadata and manifest
        env:
          CHANNEL: development
          RELEASE_VERSION: 0.1.0-alpha.${{ github.run_number }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
        run: ./scripts/publish-rpms.sh

  deploy-frontend:
    name: Frontend / Deploy to Cloudflare
    needs: [changes, frontend]
    if: github.event_name == 'push' && needs.changes.outputs.frontend == 'true' && vars.DEPLOY_FRONTEND == 'true'
    runs-on: ubuntu-latest
    environment: prd
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Download built site assets
        uses: actions/download-artifact@v7
        with:
          name: frontend-site
          path: frontend/dist
      - name: Deploy Worker assets
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  gate:
    name: gate
    if: always()
    needs: [changes, backend, frontend, rpms, workflow-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require each applicable check to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RPMS_RESULT: ${{ needs.rpms.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-check.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == success ]]
          [[ "$WORKFLOW_RESULT" == success ]]
          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT" "$RPMS_RESULT"; do
            [[ "$result" == success || "$result" == skipped ]]
          done
