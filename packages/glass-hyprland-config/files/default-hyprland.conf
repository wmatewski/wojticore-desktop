# Wojticore Glass Desktop session defaults. User copy lives in ~/.config/wojticore-glass.
monitor = ,preferred,auto,1
$mod = SUPER
$terminal = kitty

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(8998ffff) rgba(b18cffdd) 45deg
    col.inactive_border = rgba(61709a66)
    layout = dwindle
}

decoration {
    rounding = 14
    active_opacity = 0.97
    inactive_opacity = 0.92
    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.12
    }
}

animations {
    enabled = true
    bezier = glass, 0.2, 0.8, 0.2, 1
    animation = windows, 1, 5, glass, popin 85%
    animation = windowsOut, 1, 4, glass, popin 85%
    animation = fade, 1, 4, glass
    animation = workspaces, 1, 5, glass, slide
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

bind = $mod, RETURN, exec, $terminal
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, SPACE, global, quickshell:glass-launcher-toggle
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

exec-once = swaybg -i /usr/share/wojticore-glass/glass-wallpaper.png -m fill
exec-once = quickshell -p /usr/share/wojticore-glass/Shell.qml
